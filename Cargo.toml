[package]
name = "mail-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
html2text = "0.17.4"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "mime03", "pool", "ring", "rustls-native-certs", "serde", "smtp-transport", "tokio1", "tokio1-rustls"] }
mime_guess = "2.0.5"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
redundant_clone = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
